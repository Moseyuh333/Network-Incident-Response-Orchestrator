[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "network-ir-orchestrator"
version = "0.1.0"
description = "Defensive network incident response orchestrator with LLM-assisted triage"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Moseyuh333" }]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlmodel>=0.0.22",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "jinja2>=3.1.3",
    "httpx>=0.27.0",
    "google-genai>=1.0.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
]
ml = [
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",
]
reports = [
    # Optional: enables ``report.docx`` output from the report-generation
    # skill. The skill degrades gracefully (still emits .md/.json/.txt) if
    # python-docx is not installed.
    "python-docx>=1.1.0",
]
all = [
    "network-ir-orchestrator[ml,dev,reports]",
] # placeholder so ``pip install -e .[all]`` works once subdeps exist

[project.scripts]
niro = "app.main:run"
niro-pipeline = "scripts.run_pipeline:main"
niro-web = "app.web.server:run_web"

[tool.hatch.build.targets.wheel]
packages = ["app", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
